name: Mobile CI

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'

defaults:
  run:
    working-directory: apps/mobile

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # localDate.test.ts needs a non-UTC zone to exercise its early-morning-local-time case, and
      # mutating process.env.TZ at runtime (inside beforeAll) is not reliable across Node/ICU
      # builds — some cache the host timezone at process start regardless of a later mutation,
      # which is exactly what made this test fail here before while passing on a contributor's own
      # machine. Setting TZ before the process starts makes it reliable everywhere, CI included.
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci
