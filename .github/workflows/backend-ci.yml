name: Backend CI

on:
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/api/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore FitnessCompanion.sln

      - name: Build
        run: dotnet build FitnessCompanion.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test FitnessCompanion.sln --no-build --configuration Release
